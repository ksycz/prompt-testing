# Minimal isolated Promptfoo config to test the Confidence assert

description: "Dummy confidence test"

env:
  allow: all

# One simple prompt
prompts:
  - "Answer the following question: {{question}}"

providers:
  - id: openai:gpt-5-mini
    config:
      temperature: 0.0
      max_tokens: 150

tests:
  - vars:
      question: "Dummy question: Choose any option. (A) One (B) Two (C) Three (D) Four"

    assert:
      # 1) Basic format assert — must start with a letter in parentheses
      - type: regex
        value: '^\([A-D]\)'

      # 2) Confidence assert — the one we want to verify
      - type: llm-rubric
        value: |
          Confidence check:
          Require the assistant to output:
          Line 1: "(X)"
          Line 2: "Confidence: N/10" followed by a brief reason.
          PASS only if N is a number between 0 and 10 and N >= 7.
          FAIL if the confidence is missing, invalid, or below threshold.
