# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

# Learn more about building a configuration: https://promptfoo.dev/docs/configuration/guide

description: "My First Prompt Tests"

# needed if you have API key in the .env file
env:
  allow: all

prompts:
  - prompt1.yaml # control prompt, baseline
  - prompt1_academic.yaml 
  - prompt1_informal.yaml
  - prompt2.yaml # emotional stimuli
  - prompt2_academic.yaml 
  - prompt2_informal.yaml
  - prompt3.yaml # expert persona
  - prompt3_academic.yaml 
  - prompt3_informal.yaml
  - prompt4.yaml # zero shot chain of thought
  - prompt4_academic.yaml 
  - prompt4_informal.yaml

# Grading is deterministic: each row in questions.csv has a regex assert
# on the final "Answer: (X)" line, so no AI judge is needed here.

# Models under test: the small/fast tier of each vendor, so the comparison is fair
# (mini vs flash vs haiku, not a small model against a big one)
providers:
- id: "openai:gpt-5-mini"
  config:
    temperature: 1.0
    max_tokens: 1000
    # set if you do not have the key in the .env file
    # apiKey: OPENAI_API_KEY
- id: "google:gemini-3.8-flash"
  config:
    temperature: 1.0
    maxOutputTokens: 1000
    # set if you do not have the key in the .env file
    # apiKey: GEMINI_API_KEY
- id: "anthropic:messages:claude-haiku-5-5"
  config:
    # no temperature: newer Claude models ignore sampling params (promptfoo warns)
    max_tokens: 1000
# set if you do not have the key in the .env file
# apiKey: ANTHROPIC_API_KEY
